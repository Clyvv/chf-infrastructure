#cloud-config

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose
  - nginx
  - ufw
  - git
  - curl

users:
  - name: deploy
    groups: docker
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh-authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINzEilzRpPrPNDW9dwA95eDlPNqMYGbghmIXLROH/ZvY cmawoko@gmail.com

runcmd:

  # Enable Docker
  - systemctl enable docker
  - systemctl start docker

  # Firewall setup
  - ufw allow OpenSSH
  - ufw allow 80
  - ufw allow 443
  - ufw --force enable

  # Basic Nginx setup
  - systemctl enable nginx
  - systemctl start nginx

  # Create app directory
  - mkdir -p /opt/chf
  - chown -R deploy:deploy /opt/chf