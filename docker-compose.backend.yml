
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: chf-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chfdb}
      POSTGRES_USER: ${POSTGRES_USER:-chfuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - chf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chfuser} -d ${POSTGRES_DB:-chfdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    # Security: Don't expose ports in production (only backend connects internally)

  # Spring Boot Backend
  backend:
    # Use pre-built image from DTR in production
    image: ${DOCKER_REGISTRY:-hub.docker.com}/chf-backend:${IMAGE_TAG:-latest}
    container_name: chf-backend-prod
    environment:
      # Database connection (use service name 'postgres' as hostname)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chfdb}?currentSchema=public
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-chfuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      
      # Liquibase configuration
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_SHOULD_RUN: "true"
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      # CORS (restrict to your frontend domain in production)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}

      # App base URL (used in activation email links)
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set}

      # Mail (SMTP)
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?SPRING_MAIL_USERNAME must be set}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?SPRING_MAIL_PASSWORD must be set}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"

      # JPA configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "false"
      
      # Server configuration
      SERVER_PORT: 8124
      SERVER_SERVLET_CONTEXT_PATH: /api
      
      # Spring profiles
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    volumes:
      - logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8124}:8124"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chf-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8124/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 5
    restart: always
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

volumes:
  postgres_prod_data:
    driver: local

networks:
  chf-network:
    external: true

