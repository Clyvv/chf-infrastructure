# Filebeat Production Configuration
filebeat.inputs:
  # CHF Backend application logs
  - type: log
    enabled: true
    paths:
      - /var/log/chf-backend/*.log
    # JSON parsing
    json.keys_under_root: false
    json.add_error_key: true
    json.message_key: message
    # Fields
    fields:
      app: chf-backend
      environment: ${ENVIRONMENT:production}
    fields_under_root: false
    # Multiline handling for stack traces
    multiline.type: pattern
    multiline.pattern: '^\s+'
    multiline.negate: false
    multiline.match: after
    # Performance
    close_inactive: 5m
    scan_frequency: 10s
    harvester_buffer_size: 16384
    max_bytes: 10485760  # 10MB
# Output to Logstash
output.logstash:
  hosts: ["${LOGSTASH_HOSTS:logstash:5000}"]
  # Load balancing
  loadbalance: true
  worker: 2
  # Reliability
  bulk_max_size: 2048
  timeout: 30s
  # Compression
  compression_level: 3
# Logging
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
# Processors (data enrichment)
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~
# NOTE: monitoring.* settings are deprecated in Filebeat 8.x
# Use Stack Monitoring in Kibana instead
