input {
  beats {
    port => 5000
    type => "filebeat"
  }
}

filter {
  # Parse JSON logs from CHF backend
  if [type] == "filebeat" {
    # Parse the JSON message
    json {
      source => "message"
      skip_on_invalid_json => true
    }

    # Parse and set the timestamp first (before any field removal)
    if [@timestamp] {
      date {
        match => [ "[@timestamp]", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSZ", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSZZ" ]
        target => "@timestamp"
      }
    }

    # Rename fields to flatten structure
    if [message] {
      mutate {
        rename => { "message" => "log_message" }
      }
    }

    if [trackingId] {
      mutate {
        rename => { "trackingId" => "tracking_id" }
      }
    }

    if [logger_name] {
      mutate {
        copy => { "logger_name" => "logger" }
      }
    }

    if [level] {
      mutate {
        rename => { "level" => "log_level" }
      }
    }

    if [thread_name] {
      mutate {
        copy => { "thread_name" => "thread" }
      }
    }

    # Add consistent application metadata
    mutate {
      add_field => {
        "application" => "chf-backend"
        "environment" => "${ENVIRONMENT:production}"
      }
    }

    # Clean up redundant or unused fields
    mutate {
      remove_field => [
        "springAppName",
        "app_name",
        "@version",
        "level_value"
      ]
    }

    # Handle stack traces if present
    if [stack_trace] {
      mutate {
        gsub => [ "stack_trace", "\\n", "\n" ]
      }
    }
  }
}

output {
  # Send to Elasticsearch with daily indices
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "chf-logs-%{+YYYY.MM.dd}"

    # Disable ILM (Index Lifecycle Management) for simplicity
    # Enable later by creating the policy in Elasticsearch first
    ilm_enabled => false
  }

  # Debug output (comment out in production)
  # stdout {
  #   codec => rubydebug
  # }
}

